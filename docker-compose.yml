services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
  one-time-secret:
    image: onetimesecret/onetimesecret:latest
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - "3000:3000"
    environment:
      TZ: Asia/Shanghai
      SECRET: change-this-secret
      REDIS_URL: redis://redis:6379

volumes:
  redis-data:
